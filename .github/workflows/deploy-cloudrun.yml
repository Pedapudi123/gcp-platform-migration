name: Deploy to Cloud Run

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: "projects/154319976419/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
        service_account: "github-cloudrun-sa@project-85979920-1575-42eb-9d4.iam.gserviceaccount.com"

    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy flask-app \
          --source . \
          --region us-central1 \
          --project project-85979920-1575-42eb-9d4 \
          --platform managed \
          --allow-unauthenticated

